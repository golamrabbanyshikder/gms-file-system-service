spring.application.name=file-system-service

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.datasource.url=jdbc:mysql://localhost:3306/gms_filesystem?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

server.port=8083
server.servlet.context-path=/

file.upload-dir=./uploads/files/

logging.level.root=INFO
logging.level.com.gms=DEBUG

# Permanent key gateway-service uses to call this service - must match
# gateway-service's own internal.api-key. Override both via the same
# INTERNAL_API_KEY env var in production.
internal.gateway-api-key=${INTERNAL_API_KEY:gms-internal-7f3a9c2e8b1d4f6a0c5e9b3d7a1f4c8e}
